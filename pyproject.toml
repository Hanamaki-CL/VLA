[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mealvla"
version = "1.0.0"
description = "Language-conditioned robot manipulation: SmolVLA integration, guarded execution and reproducible evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
robot = ["lerobot[smolvla,libero]==0.4.3", "imageio[ffmpeg]>=2.31"]
video = ["imageio[ffmpeg]>=2.31"]
dev = ["pytest>=8,<9"]

[project.urls]
Repository = "https://github.com/Hanamaki-CL/VLA"
Issues = "https://github.com/Hanamaki-CL/VLA/issues"

[project.scripts]
mealvla = "mealvla.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
